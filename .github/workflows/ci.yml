name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - name: Fetch the pinned corpus (also exercises the sha256 check)
        run: python -m rag_eval fetch
      - name: Tests (includes validation of every gold document against the corpus)
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and call /healthz
        run: |
          docker build -t rag-eval-kit .
          docker run -d --name rag -p 8000:8000 rag-eval-kit
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/healthz && break || sleep 3; done
          curl -fs -X POST http://127.0.0.1:8000/search -H 'content-type: application/json' \
            -d '{"query":"how do I run several operations in one transaction","k":3}'
